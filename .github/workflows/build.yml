name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: |
          python3 -m py_compile root/usr/bin/modem-monitor
          for f in root/etc/init.d/modem-monitor root/etc/uci-defaults/* scripts/* build.sh; do sh -n "$f"; done
          for f in root/www/luci-static/resources/view/modem-monitor/*.js; do node --check "$f"; done
          for f in root/usr/share/luci/menu.d/*.json root/usr/share/rpcd/acl.d/*.json; do python3 -m json.tool "$f" >/dev/null; done
          python3 -c "import yaml; yaml.safe_load(open('examples/zabbix/modem_monitor_by_http.yaml'))"

      - name: Smoke test against the mock modem
        run: |
          python3 test/mock_s33.py 18080 md5 Secret123 &
          sleep 1
          printf 'host=127.0.0.1:18080\npassword=Secret123\ndata_dir=/tmp/mm-data\nweb_dir=/tmp/mm-www\nping_targets=127.0.0.1\nping_count=1\n' > /tmp/mm.conf
          export MODEM_MONITOR_CONF=/tmp/mm.conf
          # run the monitor as on a router with only python3-light, -urllib and -openssl
          export PYTHONPATH=$PWD/test/pylight
          if python3 -c 'import logging' 2>/dev/null; then echo "python3-light simulation not active"; exit 1; fi
          python3 root/usr/bin/modem-monitor test
          python3 root/usr/bin/modem-monitor poll
          python3 root/usr/bin/modem-monitor poll
          curl -s http://127.0.0.1:18080/_ingress >/dev/null
          python3 root/usr/bin/modem-monitor poll
          python3 root/usr/bin/modem-monitor summary
          python3 test/cache_equiv.py
          python3 root/usr/bin/modem-monitor resources
          test -s /tmp/mm-www/summary.html
          grep -q '^modem_up 1' /tmp/mm-www/metrics.txt
          python3 root/usr/bin/modem-monitor credit
          test -s /tmp/mm-www/credit.html
          mkdir -p /tmp/mm-bk && printf 'backup_dest=/tmp/mm-bk\n' >> /tmp/mm.conf && python3 root/usr/bin/modem-monitor backup && ls /tmp/mm-bk/*.csv
          env -u PYTHONPATH python3 test/mock_speed.py 18300 & sleep 1
          printf 'speedtest_url=http://127.0.0.1:18300\nspeedtest_seconds=3\nhires_target=127.0.0.1\n' >> /tmp/mm.conf
          python3 root/usr/bin/modem-monitor speedtest --json | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['down_mbps'] and r['up_mbps'], r"
          for k in sb8200:18101 sb8200login:18102 netgear:18103; do
            n=${k%%:*}; p=${k##*:}
            env -u PYTHONPATH python3 test/mock_html.py $p $n Secret1 &
            sleep 1
            printf "host=127.0.0.1:$p\npassword=Secret1\ndata_dir=/tmp/h-$n/data\nweb_dir=/tmp/h-$n/www\nping_targets=127.0.0.1\nping_count=1\ntimeout=5\n" > /tmp/h-$n.conf
            MODEM_MONITOR_CONF=/tmp/h-$n.conf python3 root/usr/bin/modem-monitor test
            MODEM_MONITOR_CONF=/tmp/h-$n.conf python3 root/usr/bin/modem-monitor poll | grep -qx ok
          done
          ! python3 root/usr/bin/modem-monitor alert-test
          python3 root/usr/bin/modem-monitor mark "CI entry" --type other
          python3 root/usr/bin/modem-monitor export
          test -s /tmp/mm-www/index.html

      - name: Build apk-tools v3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libssl-dev zlib1g-dev pkg-config
          pip install --quiet meson
          git clone -q --depth 1 --branch v3.0.8 https://github.com/alpinelinux/apk-tools /tmp/apk-tools
          cd /tmp/apk-tools
          meson setup build -Ddocs=disabled -Dlua=disabled -Dzstd=disabled -Dtests=disabled -Dhelp=disabled -Dcrypto_backend=openssl
          ninja -C build

      - name: Build package (signed when the APK_SIGN_KEY secret is set)
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
        run: |
          if [ -n "$APK_SIGN_KEY" ]; then
            umask 077
            printf '%s\n' "$APK_SIGN_KEY" > "$RUNNER_TEMP/sign.pem"
            mkdir -p root/etc/apk/keys out
            # the matching public key ships in the package so later updates verify against it
            openssl ec -in "$RUNNER_TEMP/sign.pem" -pubout -out root/etc/apk/keys/luci-app-modem-monitor.pem
            chmod 644 root/etc/apk/keys/luci-app-modem-monitor.pem
            cp root/etc/apk/keys/luci-app-modem-monitor.pem out/luci-app-modem-monitor.pem
            export SIGN_KEY="$RUNNER_TEMP/sign.pem"
          fi
          APK=/tmp/apk-tools/build/src/apk MAINTAINER=RyanBlakeIT URL=https://github.com/${{ github.repository }} ./build.sh
          rm -f "$RUNNER_TEMP/sign.pem"
          if [ -f out/luci-app-modem-monitor.pem ]; then
            # prove the signature verifies with the published public key
            mkdir -p /tmp/vk && cp out/luci-app-modem-monitor.pem /tmp/vk/
            /tmp/apk-tools/build/src/apk verify --keys-dir /tmp/vk out/*.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: luci-app-modem-monitor-apk
          path: |
            out/*.apk
            out/*.pem

      - name: Publish release (new VERSION on main, or a v* tag)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' root/usr/bin/modem-monitor)
          TAG="v$VER"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION $VER"; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."; exit 0
          fi
          if [ -f ".github/release-notes/$TAG.md" ]; then
            cp ".github/release-notes/$TAG.md" notes.md
          else
            awk -v v="## $VER" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          fi
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no '## $VER' section: refusing to publish a release without notes"; exit 1
          fi
          if [ ! -f out/luci-app-modem-monitor.pem ] && grep -q '^SIGNED_RELEASES=1' build.sh; then
            echo "APK_SIGN_KEY secret missing: refusing to publish an unsigned release"; exit 1
          fi
          gh release create "$TAG" out/*.apk $(ls out/*.pem 2>/dev/null) --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA"
